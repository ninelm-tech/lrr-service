name: Deploy → Staging

on:
  push:
    branches:
      - staging
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/deploy-staging.yml'

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: lrr/service
  ECS_CLUSTER: lrr-staging
  ECS_SERVICE: lrr-service-staging
  IMAGE_TAG: staging

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest

    # Required for OIDC token exchange with AWS
    permissions:
      id-token: write
      contents: read

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS credentials (OIDC — no long-lived keys needed) ────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808236751302:role/github-actions-lrr
          aws-region: ${{ env.AWS_REGION }}

      # ── Login to ECR ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & push image ────────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "Building $IMAGE_URI"
          docker build \
            --cache-from $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $IMAGE_URI \
            .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ── Force new ECS deployment ──────────────────────────────────
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      # ── Wait for service to stabilise ─────────────────────────────
      - name: Wait for deployment to complete
        run: |
          echo "Waiting for ECS service to stabilise..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
          echo "✅ Deployment complete"
